name: Rotbound
version: ${version}
main: dev.rotbound.RotboundPlugin
api-version: '26.3'
author: Rotbound
description: Server-side survival, reclamation, structures, loot and weapons for the Forgotten Earth.
commands:
  rotbound:
    description: Rotbound administration and testing commands.
    usage: /rotbound <help|info|weapons|weapon|ammo|reload>
    aliases: [rb]
    permission: rotbound.admin
permissions:
  rotbound.admin:
    description: Allows administration and testing of Rotbound.
    default: op
  rotbound.weapons.use:
    description: Allows use of Rotbound weapons.
    default: true
