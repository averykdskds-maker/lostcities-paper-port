# Rotbound — The Forgotten Earth
config-version: 3
systems:
  weapons: true
  world-generation: true
  reclamation: false
  structures: true
  loot: false
  wildlife: false
  environmental-storytelling: false
world:
  target-world: world
  sea-level: 63
  structure-density: 1.0
  preserve-existing-chunks: true
settlements:
  region-size-blocks: 8192
  locate-search-regions: 4
reclamation:
  terrain-adaptation: true
  biome-aware-vegetation: true
  coastal-inundation: true
  remove-active-lights: true
ships:
  abandoned-ship-chance-per-ocean-region: 0.075
  ocean-region-size-blocks: 2048
loot:
  container-refill: false
  guarantee-valuable-items: false
  rare-discovery-multiplier: 1.0
weapons:
  pistol: { cooldown-ms: 350 }
  rifle: { cooldown-ms: 650 }
  shotgun: { cooldown-ms: 900, pellets: 6 }
  flamethrower: { cooldown-ms: 250 }
  grenade: { cooldown-ms: 1200, damage: 8.0, radius: 4.0 }
  smg: { cooldown-ms: 500 }
  railgun: { cooldown-ms: 1800, splash-radius: 2.0 }
  tear_gas: { cooldown-ms: 1800, radius: 6.0, duration-ticks: 160 }
  mortar: { cooldown-ms: 2500, fuse-ticks: 600, yield: 4.0 }
  sniper: { cooldown-ms: 10000 }
  minigun:
    interval-ticks: 4
    projectiles-per-volley: 2
    heat-per-volley: 5
    max-heat: 100
    cooling-per-10-ticks: 3
