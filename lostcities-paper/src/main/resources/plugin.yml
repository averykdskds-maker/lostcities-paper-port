name: LostCitiesPaper
version: '${version}'
main: dev.rotbound.lostcitiespaper.LostCitiesPaperPlugin
bootstrapper: dev.rotbound.lostcitiespaper.LostCitiesPaperBootstrap
api-version: '26.3'
description: Paper port of McJty's Lost Cities with Modern Tweaks datapack.
commands:
  lostcities:
    description: Lost Cities status and profile management.
    usage: /lostcities [status|reload|profile <name>]
permissions:
  lostcities.admin:
    description: Allows changing the active Lost Cities profile and reloading configuration.
    default: op
