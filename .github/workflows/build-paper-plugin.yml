name: Build Rotbound

on:
  workflow_dispatch:
  push:
    paths:
      - 'paper-plugin/**'
      - '.github/workflows/build-paper-plugin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: gradle --no-daemon -p paper-plugin clean build
      - name: Upload Rotbound JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rotbound-foundation
          path: paper-plugin/build/libs/Rotbound-0.1.0-alpha1.jar
          if-no-files-found: error
          retention-days: 30
