name: Build Lost Cities Paper 26.3

on:
  push:
    branches: [lostcities-paper-26.3]
    paths:
      - 'lostcities-paper/**'
      - '.github/workflows/build-lostcities-paper.yml'
      - 'lostcities-modern-tweaks-v6.0.0.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Fetch pinned upstream Lost Cities source
        run: |
          git clone https://github.com/McJtyMods/LostCities.git /tmp/LostCities
          git -C /tmp/LostCities checkout 4bcb0c4c49a862fee2a4239493bd186f36edccfd
      - name: Clean previous build output
        run: gradle --no-daemon -p lostcities-paper clean
      - name: Prepare upstream source, compatibility adapter and bundled datapack
        run: |
          python3 lostcities-paper/tools/prepare_sources.py \
            /tmp/LostCities \
            lostcities-modern-tweaks-v6.0.0.zip \
            lostcities-paper
      - name: Compile combined Lost Cities + Modern Tweaks plugin
        run: gradle --no-daemon -p lostcities-paper build
      - name: Smoke-test plugin on Paper 26.3
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/paper-smoke"
          mkdir -p "$smoke/plugins" "$GITHUB_WORKSPACE/smoke-artifact"
          dump_smoke_log() {
            status=$?
            if [[ -f "$smoke/server.log" ]]; then
              cp "$smoke/server.log" "$GITHUB_WORKSPACE/smoke-artifact/server.log"
              echo "---- Paper smoke-test server log (last 250 lines) ----"
              tail -n 250 "$smoke/server.log"
            fi
            return "$status"
          }
          trap dump_smoke_log EXIT
          cp lostcities-paper/build/libs/LostCitiesPaper-0.1.0-alpha1.jar "$smoke/plugins/"
          printf 'eula=true\n' > "$smoke/eula.txt"
          cat > "$smoke/server.properties" <<'PROPS'
          server-port=25575
          online-mode=false
          level-name=world
          level-seed=681734829
          view-distance=3
          simulation-distance=2
          spawn-protection=0
          sync-chunk-writes=true
          enable-rcon=false
          enable-query=false
          PROPS

          response="$(curl -fsSL \
            -H 'User-Agent: lostcities-paper-port-ci/0.1 (https://github.com/averykdskds-maker/lostcities-paper-port)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.3/builds')"
          paper_url="$(printf '%s' "$response" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url) // empty')"
          if [[ -z "$paper_url" ]]; then
            echo "Paper 26.3 stable build URL was not returned by the official downloads API."
            printf '%s\n' "$response" | head -c 3000
            exit 1
          fi
          curl -fsSL -H 'User-Agent: lostcities-paper-port-ci/0.1 (https://github.com/averykdskds-maker/lostcities-paper-port)' \
            "$paper_url" -o "$smoke/paper.jar"

          cd "$smoke"
          mkfifo console.in
          java -Xms1G -Xmx2G -jar paper.jar --nogui < console.in > server.log 2>&1 &
          server_pid=$!
          exec 3>console.in

          ready=0
          for _ in $(seq 1 180); do
            if grep -q 'Done (' server.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Paper exited before startup completed."
              tail -n 250 server.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "Paper did not finish startup within the smoke-test limit."
            tail -n 250 server.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi

          echo 'datapack list enabled' >&3
          sleep 3
          echo 'forceload add 1600 1600' >&3
          sleep 30
          echo 'forceload query' >&3
          sleep 2
          echo 'stop' >&3
          exec 3>&-
          wait "$server_pid"

          grep -q 'Lost Cities Paper port enabled' server.log || { echo "Plugin main class did not finish enabling."; exit 1; }
          grep -q 'Attached original Lost Cities generation to world' server.log || { echo "Lost Cities populator did not attach to the target world."; exit 1; }
          grep -q 'Lost Cities FEATURES generation entered' server.log || { echo "The forced chunk did not enter the Lost Cities FEATURES callback."; exit 1; }
          attach_line="$(grep -n -m1 'Attached original Lost Cities generation to world' server.log | cut -d: -f1)"
          spawn_ready_line="$(grep -n -m1 'Prepared spawn area in' server.log | cut -d: -f1)"
          features_line="$(grep -n -m1 'Lost Cities FEATURES generation entered' server.log | cut -d: -f1)"
          if [[ -z "$attach_line" || -z "$spawn_ready_line" || -z "$features_line" ]]               || (( attach_line >= spawn_ready_line )) || (( features_line >= spawn_ready_line )); then
            echo "The Lost Cities populator was not attached and invoked before spawn-area generation completed."
            exit 1
          fi
          test -f config/lostcities-server.toml || { echo "Lost Cities server TOML was not created."; exit 1; }
          test -f config/lostcities/profiles/default.json || { echo "Default Lost Cities profile JSON was not created."; exit 1; }
          if grep -E 'Error generating chunk|Failed to load Lost Cities|Could not load plugin|Failed to enable LostCitiesPaper' server.log; then
            echo "Lost Cities runtime smoke test emitted a generation/plugin error."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/smoke-artifact"
          cp server.log "$GITHUB_WORKSPACE/smoke-artifact/server.log"
          echo "Paper runtime smoke test completed with the Lost Cities generation callback invoked."
      - name: Upload Paper smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LostCitiesPaper-26.3-smoke-test
          path: smoke-artifact/server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload combined plugin
        uses: actions/upload-artifact@v4
        with:
          name: LostCitiesPaper-26.3
          path: lostcities-paper/build/libs/LostCitiesPaper-0.1.0-alpha1.jar
          if-no-files-found: error
          retention-days: 30
