name: Build Lost Cities Paper 26.3
on:
  push:
    branches: [lostcities-paper-26.3]
    paths:
      - 'lostcities-paper/**'
      - '.github/workflows/build-lostcities-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile Lost Cities Paper plugin
        run: gradle --no-daemon -p lostcities-paper clean build
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: LostCitiesPaper-26.3
          path: lostcities-paper/build/libs/LostCitiesPaper-0.1.0-alpha1.jar
          if-no-files-found: error
          retention-days: 30
